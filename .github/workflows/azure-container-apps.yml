name: Backend CI/CD - Azure Container Apps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: edumaster-backend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
  AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile application modules
        run: python -m compileall -q config.py main.py routers services utils

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment variables
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in AZURE_RESOURCE_GROUP AZURE_CONTAINER_APP AZURE_CONTAINER_REGISTRY; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error title=Missing GitHub Actions variable::$name is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables."
              missing=1
            else
              echo "$name=$value"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Verify Azure target resources
        shell: bash
        run: |
          set -euo pipefail

          echo "Azure account:"
          az account show --query "{subscription:id, tenant:tenantId, user:user.name}" --output table

          if [ "$(az group exists --name "$AZURE_RESOURCE_GROUP")" != "true" ]; then
            echo "::error title=Azure resource group not found::Resource group '$AZURE_RESOURCE_GROUP' was not found in this subscription."
            exit 1
          fi

          az acr show \
            --name "$AZURE_CONTAINER_REGISTRY" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "{name:name, loginServer:loginServer}" \
            --output table

          az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "{name:name, latestRevision:properties.latestRevisionName}" \
            --output table

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail

          echo "Disk before cleanup:"
          df -h

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost || true

          docker system prune -af || true
          docker builder prune -af || true

          echo "Disk after cleanup:"
          df -h

      - name: Log in to Azure Container Registry
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY"

      - name: Build and push image
        shell: bash
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail

          IMAGE_SHA="${AZURE_CONTAINER_REGISTRY}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}"
          IMAGE_LATEST="${AZURE_CONTAINER_REGISTRY}.azurecr.io/${IMAGE_NAME}:latest"

          docker build \
            --file Dockerfile.ci \
            --tag "$IMAGE_SHA" \
            --tag "$IMAGE_LATEST" \
            .

          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"

          docker image rm "$IMAGE_SHA" "$IMAGE_LATEST" || true

      - name: Deploy image to Container Apps
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${AZURE_CONTAINER_REGISTRY}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}"
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none

      - name: Smoke test health endpoint
        shell: bash
        run: |
          FQDN="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          URL="https://${FQDN}/health"
          echo "Checking ${URL}"

          for attempt in {1..24}; do
            if curl --fail --silent --show-error "$URL"; then
              echo
              echo "Health check passed."
              exit 0
            fi
            echo "Waiting for the new revision... attempt ${attempt}/24"
            sleep 10
          done

          echo "Health check failed after waiting for the new revision."
          exit 1
