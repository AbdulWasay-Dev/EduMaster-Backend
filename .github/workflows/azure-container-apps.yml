name: Backend CI/CD - Azure Container Apps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: edumaster-backend
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
  AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile application modules
        run: python -m compileall -q config.py main.py routers services utils

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment variables
        shell: bash
        run: |
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$AZURE_CONTAINER_APP"
          test -n "$AZURE_CONTAINER_REGISTRY"

      - name: Build image in Azure Container Registry
        run: |
          az acr build \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --file Dockerfile \
            --image "${IMAGE_NAME}:${GITHUB_SHA}" \
            --image "${IMAGE_NAME}:latest" \
            .

      - name: Deploy image to Container Apps
        run: |
          IMAGE="${AZURE_CONTAINER_REGISTRY}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}"
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none

      - name: Smoke test health endpoint
        shell: bash
        run: |
          FQDN="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          URL="https://${FQDN}/health"
          echo "Checking ${URL}"

          for attempt in {1..24}; do
            if curl --fail --silent --show-error "$URL"; then
              echo
              echo "Health check passed."
              exit 0
            fi
            echo "Waiting for the new revision... attempt ${attempt}/24"
            sleep 10
          done

          echo "Health check failed after waiting for the new revision."
          exit 1
